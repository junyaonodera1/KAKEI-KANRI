<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>小野寺家の家計</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif; color: #3D4A2A;
    background: linear-gradient(180deg, #FFFDF3 0%, #EFF7DE 45%, #E3F3D6 100%);
    min-height: 100vh;
  }
  .hba { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  .hba h1, .hba h2, .num { font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif; }
  input, select, button { font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif; }
  input, select { font-variant-numeric: tabular-nums; }

  .app-header { text-align: center; margin-bottom: 18px; }
  .home-photo-wrap { margin-bottom: 14px; }
  .home-photo-frame {
    width: 100%; max-width: 380px; padding: 10px 10px 22px; border-radius: 16px;
    box-shadow: 0 10px 24px rgba(139,195,74,0.3), 0 0 0 1px rgba(255,255,255,0.6) inset;
    border: none; overflow: hidden;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto; transform: rotate(-1.5deg); position: relative;
  }
  .home-photo-frame::after {
    content: "🌼"; position: absolute; top: -10px; right: -6px; font-size: 26px;
    transform: rotate(15deg);
  }
  .home-photo-inner {
    width: 100%; height: 170px; border-radius: 10px; overflow: hidden;
    background: linear-gradient(135deg, #DCEDC8, #FFF9C4);
    display: flex; align-items: center; justify-content: center;
  }
  .home-photo { width: 100%; height: 100%; object-fit: contain; }
  .check-row { display:flex; align-items:center; gap:10px; }
  .check-row input[type=checkbox] {
    width: 22px; height: 22px; accent-color: #7CB342; cursor: pointer; flex-shrink: 0;
  }
  .home-message {
    font-size: 12px; color: #6E8B3D; margin-top: 8px; font-weight: 700;
  }
  .app-header h1 {
    font-size: 26px; margin: 0 0 4px; letter-spacing: 0.02em; font-weight: 800;
    background: linear-gradient(90deg, #7CB342, #C0CA33, #FBC02D);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .app-header .sub { font-size: 11px; color: #8FA968; font-weight: 700; }
  .conn-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }

  .hba-tabs {
    display: flex; flex-wrap: wrap; gap: 6px; background: #fff; border-radius: 20px;
    padding: 6px; margin-bottom: 18px; box-shadow: 0 3px 12px rgba(139,195,74,0.18);
  }
  .hba-tab {
    flex: 1 1 30%; text-align: center; padding: 10px 6px; font-size: 12px; font-weight: 700;
    cursor: pointer; color: #93A876; border-radius: 14px; white-space: nowrap;
    transition: all 0.2s ease;
  }
  .hba-tab.active {
    color: #fff; background: linear-gradient(135deg, #9CCC65, #7CB342);
    border-radius: 14px; box-shadow: 0 3px 8px rgba(124,179,66,0.4);
  }
  .hba-page { display: none; animation: fadeIn 0.25s ease; }
  .hba-page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .hba-card {
    background: #fff; border-radius: 20px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 3px 14px rgba(139,195,74,0.14); border: 2px solid #F1F8E4;
  }
  .hba-action-card {
    background: linear-gradient(135deg, #F1F8E9, #FFFDE7); border-left: 5px solid #9CCC65;
    border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: 0 3px 14px rgba(139,195,74,0.16);
  }
  .hba-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px dashed #E8F2D8; font-size: 14px; gap: 8px;
  }
  .hba-row:last-child { border-bottom: none; }

  input[type=number], input[type=text], input[type=month] {
    border: 2px solid #E3F0CE; border-radius: 12px; padding: 7px 10px; font-size: 14px;
    width: 100px; text-align: right; background: #FBFEF6; transition: border-color 0.15s;
  }
  input:focus, select:focus { outline: none; border-color: #9CCC65; }
  select { border: 2px solid #E3F0CE; border-radius: 12px; padding: 7px; font-size: 13px; background: #FBFEF6; }

  button { transition: all 0.15s ease; }
  button.primary {
    width: 100%; background: linear-gradient(135deg, #9CCC65, #7CB342); color: #fff; border: none; border-radius: 999px;
    padding: 13px; font-size: 14px; font-weight: 800; cursor: pointer; margin: 10px 0;
    box-shadow: 0 4px 14px rgba(124,179,66,0.4);
  }
  button.primary:active { transform: scale(0.98); }
  button.secondary {
    background: #fff; color: #6E8B3D; border: 2px solid #D9ECC0; border-radius: 999px;
    padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  button.icon-delete {
    background: #F5F9EC; color: #B7C9A0; border: none; border-radius: 50%;
    width: 30px; height: 30px; min-width: 30px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; flex-shrink: 0;
  }
  button.icon-delete:hover, button.icon-delete:active { background: #FDE7E7; color: #E4694F; }
  .payer-chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 4px 3px 8px;
    background: #F1F8E4; border-radius: 999px; color: #6E8B3D; font-weight: 700;
  }
  .muted { color: #9BAE83; font-size: 12px; }
  .big { font-size: 23px; font-weight: 800; letter-spacing: 0.01em; }
  .status { font-size: 12px; color: #6E8B3D; text-align: center; margin-top: 6px; min-height: 16px; font-weight: 700; }
  .pill { display: inline-block; background: #F1F8E4; border-radius: 999px; padding: 2px 10px; font-size: 11px; color: #6E8B3D; font-weight: 700; }
  .loading-screen { text-align:center; padding: 80px 20px; color:#9BAE83; font-size:13px; }
</style>
</head>
<body>
<div class="hba">
  <div class="app-header">

      <div class="home-photo-frame">

  <div id="app-root" style="display:none;">
    <div class="hba-tabs">

      <div class="status" id="save-status"></div>

    <!-- 設定ページ -->
    <div class="hba-page" id="page-settings">
      <div class="hba-card">
        <div style="font-weight:700; margin-bottom:8px;">ホーム画面の写真</div>
        <div id="settings-photo-preview" style="margin-bottom:10px;"></div>

        <div style="display:flex; gap:8px; margin-top:8px;">

        </div>

      </div>
      <div class="muted" style="margin: 16px 0 6px;">カテゴリ一覧(タップで編集)</div>
      <div id="cat-list"></div>
      <button class="secondary" id="add-cat-btn" style="width:100%; margin-top:8px;">＋ カテゴリを追加</button>
      <button class="primary" id="save-settings-btn">設定を保存</button>
      <div class="status" id="settings-status"></div>
    </div>

    <!-- 履歴ページ -->
    <div class="hba-page" id="page-history">
      <div id="history-list"></div>
    </div>

    <!-- 将来シミュレーションページ -->
    <div class="hba-page" id="page-sim">
      <p class="muted" style="margin-bottom:12px;">積立系カテゴリの月額を、複利で運用した場合の将来額を試算します。年利は各カテゴリごとに変更できます(デフォルト6%)。</p>
      <div class="hba-card">
        <div class="muted" style="margin-bottom:8px;">積立合計の推移</div>
        <div style="position:relative; height:220px;"><canvas id="sim-chart"></canvas></div>
      </div>
      <div id="sim-list"></div>
    </div>
  </div>

  <div id="loading-screen" class="loading-screen">データを読み込んでいます…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script>
(function(){
  // ---- Firebaseの設定(このプロジェクト専用の値。夫婦以外の家庭が同じ値を使っても混ざりません) ----
  const firebaseConfig = {
    apiKey: "AIzaSyCZcRsXrrOVL8y1coeqn9-ypkJVty7-UeI",
    authDomain: "kakei-kanri-79fc4.firebaseapp.com",
    projectId: "kakei-kanri-79fc4",
    storageBucket: "kakei-kanri-79fc4.firebasestorage.app",
    messagingSenderId: "30490789761",
    appId: "1:30490789761:web:b32b334568229e8f025500"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const ACCOUNTS = ["夫メインバンク","妻メインバンク","妻PayPay口座","夫の投資用口座","妻の投資用口座(SBI NISA)"];
  const DEFAULT_CATS = [
    {id:"loan", name:"住宅ローン返済", amount:18.8, type:"支出", account:"夫メインバンク", payer:"夫婦"},
    {id:"childcare_fee", name:"保育料(定額)", amount:6.3, type:"支出", account:"夫メインバンク", payer:"夫婦"},
    {id:"insurance_husband", name:"夫の保険料", amount:1.1, type:"支出", account:"夫メインバンク", payer:"夫"},
    {id:"phone_husband", name:"夫のスマホ代", amount:0.75, type:"支出", account:"夫メインバンク", payer:"夫"},
    {id:"husband_allowance", name:"夫のお小遣い", amount:3.0, type:"支出", account:"夫メインバンク", payer:"夫"},
    {id:"insurance_wife", name:"妻の保険料", amount:1.1, type:"支出", account:"妻メインバンク", payer:"妻"},
    {id:"phone_wife", name:"妻のスマホ代", amount:0.75, type:"支出", account:"妻メインバンク", payer:"妻"},
    {id:"wife_allowance", name:"妻のお小遣い", amount:5.0, type:"支出", account:"妻メインバンク", payer:"妻"},
    {id:"food", name:"食費", amount:10.5, type:"支出", account:"妻PayPay口座", payer:"夫婦"},
    {id:"daily_goods", name:"日用品", amount:2.0, type:"支出", account:"妻PayPay口座", payer:"夫婦"},
    {id:"childcare_daily", name:"育児(おむつ等)", amount:2.0, type:"支出", account:"妻PayPay口座", payer:"夫婦"},
    {id:"transport", name:"交通", amount:3.2, type:"支出", account:"妻PayPay口座", payer:"夫婦"},
    {id:"education_daily", name:"教育(日々)", amount:1.0, type:"支出", account:"妻PayPay口座", payer:"夫婦"},
    {id:"reserve", name:"予備費", amount:2.5, type:"支出", account:"妻PayPay口座", payer:"夫婦"},
    {id:"leisure", name:"レジャー", amount:2.0, type:"支出", account:"妻PayPay口座", payer:"夫婦"},
    {id:"living_other", name:"生活費(水道光熱・被服)", amount:4.0, type:"支出", account:"妻PayPay口座", payer:"夫婦"},
    {id:"retire_invest", name:"老後資金(NISA+iDeCo)", amount:1.5, type:"積立", account:"夫の投資用口座", annualReturn:6, goalTarget:null, currentBalance:0, payer:"夫婦"},
    {id:"loan_payoff_fund", name:"ローン完済準備金", amount:1.5, type:"積立", account:"夫の投資用口座", annualReturn:6, goalTarget:1303, currentBalance:0, payer:"夫婦"},
    {id:"repair_fund", name:"住宅修繕費", amount:1.5, type:"積立", account:"夫の投資用口座", annualReturn:6, goalTarget:180, currentBalance:0, payer:"夫婦"},
    {id:"education_fund", name:"教育資金積立(子2人分)", amount:3.0, type:"積立", account:"妻の投資用口座(SBI NISA)", annualReturn:6, goalTarget:800, currentBalance:0, payer:"夫婦"},
    {id:"child_allowance", name:"子供手当", amount:1.5, type:"給付", account:"妻PayPay口座"},
  ];
  const DEFAULT_SETTINGS = { homePhoto: null, categories: DEFAULT_CATS };

  let settings = null;
  let monthsCache = {};
  let settingsLoaded = false, monthsLoaded = false, appStarted = false;
  let currentMonthKey = null;

  function thisMonthStr(){ return new Date().toISOString().slice(0,7); }
  function fmt(n){ return (Math.round(n*10)/10).toFixed(1); }

  function setConn(text, color){
    document.getElementById('conn-status').innerHTML =
      `<span class="conn-dot" style="background:${color};"></span>${text}`;
  }

  // ---- ホーム画面の写真・ひとことメッセージ ----
  const HOME_MESSAGES = [
    "今日もコツコツ、未来の家族のために。",
    "小さな積み重ねが、大きな安心になる。",
    "お金の話も、家族の会話のひとつ。",
    "今月もお疲れさまでした。",
    "先取り貯蓄、今日も順調。",
    "子どもの未来に、今日も一歩。",
    "夫婦で見る数字は、心強い味方。",
  ];
  function renderHomeMessage(){
    const idx = new Date().getDate() % HOME_MESSAGES.length;
    document.getElementById('home-message').textContent = HOME_MESSAGES[idx];
  }
  function renderHomePhoto(){
    const wrap = document.getElementById('home-photo-wrap');
    const img = document.getElementById('home-photo');
    const preview = document.getElementById('settings-photo-preview');
    if(settings.homePhoto){
      img.src = settings.homePhoto;
      wrap.style.display = 'block';
      if(preview) preview.innerHTML = `<img src="${settings.homePhoto}" style="width:100%; max-width:280px; border-radius:14px; display:block;">`;
    } else {
      wrap.style.display = 'none';
      if(preview) preview.innerHTML = `<div class="muted">まだ写真が設定されていません</div>`;
    }
  }
  function resizeImageFile(file, maxWidth){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  document.getElementById('photo-input').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try {
      const dataUrl = await resizeImageFile(file, 800);
      settings.homePhoto = dataUrl;
      saveSettings();
      renderHomePhoto();
    } catch(err){
      alert('写真の読み込みに失敗しました');
    }
  });
  document.getElementById('remove-photo-btn').addEventListener('click', ()=>{
    settings.homePhoto = null;
    saveSettings();
    renderHomePhoto();
  });

  // ---- Firestore 読み書き ----
  const settingsRef = db.collection('settings').doc('main');
  const monthsCol = db.collection('months');

  function saveSettings(){
    settingsRef.set(settings).then(()=>{
      const s = document.getElementById('settings-status');
      s.textContent = '設定を保存しました(相手の端末にも自動反映されます)';
      setTimeout(()=> s.textContent='', 3000);
    }).catch(e=>{
      const s = document.getElementById('settings-status');
      s.textContent = '保存に失敗しました: '+e.message;
    });
  }

  function setMonth(monthKey, data){
    const withTs = Object.assign({}, data, { _modifiedAt: new Date().toISOString() });
    return monthsCol.doc(monthKey).set(withTs);
  }
  function getMonth(monthKey){ return monthsCache[monthKey] || null; }
  function listMonths(){ return Object.keys(monthsCache).sort(); }

  function sumBy(filterFn){
    return settings.categories.filter(filterFn).reduce((a,c)=>a+Number(c.amount||0),0);
  }

  function computeInstructions(m){
    const husbandFixed = sumBy(c => c.account==="夫メインバンク" && c.type==="支出");
    const husbandAuto = sumBy(c => c.account==="夫の投資用口座");
    const wifePayPayNeed = sumBy(c => c.account==="妻PayPay口座" && c.type==="支出") + sumBy(c => c.account==="妻PayPay口座" && c.type==="給付");
    const wifeFixed = sumBy(c => c.account==="妻メインバンク" && c.type==="支出");
    const wifeAuto = sumBy(c => c.account==="妻の投資用口座(SBI NISA)");
    const benefitHusbandBank = sumBy(c => c.account==="夫メインバンク" && c.type==="給付");
    const benefitWifeBank = sumBy(c => c.account==="妻メインバンク" && c.type==="給付");

    const hIncome = Number(m.husbandIncome||0), wIncome = Number(m.wifeIncome||0);
    const hBalance = Number(m.husbandBalance||0), wBalance = Number(m.wifeBalance||0);

    // 手取り比率
    const totalIncome = hIncome + wIncome;
    const wRatio = totalIncome > 0 ? wIncome/totalIncome : 0.5;
    const hRatio = 1 - wRatio;

    // 「夫婦」負担カテゴリの総額
    const sharedSum = sumBy(c => c.payer === "夫婦");
    const totalShared = sharedSum;
    const idealHusbandShare = totalShared * hRatio;
    const idealWifeShare = totalShared * wRatio;

    // 夫婦負担のうち、既にどちらかの口座から構造的に出ていく分
    const structHusband = sumBy(c => c.payer==="夫婦" && (c.account==="夫メインバンク" || c.account==="夫の投資用口座"));
    const structWife = sumBy(c => c.payer==="夫婦" && (c.account==="妻メインバンク" || c.account==="妻の投資用口座(SBI NISA)"));
    const structPayPay = sumBy(c => c.payer==="夫婦" && c.account==="妻PayPay口座" && c.type==="支出");

    // 妻のPayPay拠出額は「公正な負担額 - 既に構造的に払っている分」。PayPayの必要額(給付を含む)を超えない範囲で
    const G_raw = idealWifeShare - structWife;
    const G = Math.min(Math.max(0, G_raw), wifePayPayNeed);
    const H = Math.max(0, wifePayPayNeed - G);
    // 清算(せいさん): PayPayの範囲では吸収しきれない公正負担の差額。正=妻→夫、負=夫→妻
    const settlement = G_raw - Math.min(Math.max(0, G_raw), structPayPay);

    const F = Math.max(0, (wifeFixed + wifeAuto + G + settlement) - (wIncome + benefitWifeBank));

    const husbandOutflow = husbandFixed + husbandAuto + H + Math.max(0, -settlement);
    const husbandAvailable = hIncome + hBalance + Math.max(0, settlement) + benefitHusbandBank;
    const wifeOutflow = wifeFixed + wifeAuto + G + Math.max(0, settlement);
    const wifeAvailable = wIncome + wBalance + Math.max(0, -settlement) + benefitWifeBank;

    const husbandMonthlyBalance = hIncome - husbandOutflow;
    const wifeMonthlyBalance = wIncome - wifeOutflow;

    return { F, G, H, settlement, husbandFixed, husbandAuto, wifePayPayNeed, wifeFixed, wifeAuto,
      husbandOutflow, husbandAvailable, wifeOutflow, wifeAvailable,
      husbandMonthlyBalance, wifeMonthlyBalance, wRatio, hRatio,
      totalShared, idealHusbandShare, idealWifeShare, structHusband, structWife, structPayPay };
  }

  function getInstructionItems(r){
    const items = [
      {key:'a', label:'① 夫メインバンク→妻メインバンク', amount: r.F},
      {key:'b', label:'② 妻メインバンク→妻PayPay', amount: r.G},
      {key:'c', label:'③ 夫メインバンク→妻PayPay', amount: r.H},
    ];
    if(Math.abs(r.settlement) > 0.05){
      if(r.settlement > 0){
        items.push({key:'d', label:'④ 清算：妻メインバンク→夫メインバンク', amount: r.settlement});
      } else {
        items.push({key:'d', label:'④ 清算：夫メインバンク→妻メインバンク', amount: -r.settlement});
      }
    }
    return items;
  }

  function renderInstructions(monthKey){
    currentMonthKey = monthKey;
    document.getElementById('instr-month').textContent = monthKey || '(月を選択してください)';
    const content = document.getElementById('instr-content');
    if(!monthKey){ content.innerHTML = '<p class="muted">「今月の入力」タブでまず今月のデータを入力してください。</p>'; return; }
    const m = getMonth(monthKey);
    if(!m || m.husbandIncome==null || m.wifeIncome==null){
      content.innerHTML = '<p class="muted">この月はまだ入力されていません。「今月の入力」タブから入力してください。</p>';
      return;
    }
    const r = computeInstructions(m);
    const checks = m.checks || {};
    let html = '';
    const balCard = (label, val) => {
      const isDeficit = val < 0;
      const color = isDeficit ? '#C0503A' : '#2F6F5E';
      const word = isDeficit ? '赤字' : '黒字';
      return `<div class="hba-card" style="border-left:4px solid ${color};">
        <div class="muted">${label}(今月の収支)</div>
        <div class="big" style="color:${color};">${isDeficit?'−':'+'}${fmt(Math.abs(val))} 万円　<span style="font-size:13px; font-weight:400;">(${word})</span></div>
      </div>`;
    };
    html += balCard('夫メインバンク', r.husbandMonthlyBalance);
    html += balCard('妻メインバンク', r.wifeMonthlyBalance);

    const items = getInstructionItems(r);
    items.forEach(item => {
      const checked = !!checks[item.key];
      html += `<div class="hba-action-card">
        <div class="check-row">
          <input type="checkbox" data-check="${item.key}" ${checked?"checked":""}>
          <div style="flex:1;">
            <div class="muted">${item.label}</div>
            <div class="big">${fmt(item.amount)} 万円</div>
          </div>
        </div>
      </div>`;
    });

    html += `<div class="hba-card">
      <div class="muted" style="margin-bottom:6px;">内訳(参考)</div>
      <div class="hba-row"><span>夫メインバンク固定費</span><span>${fmt(r.husbandFixed)}万円</span></div>
      <div class="hba-row"><span>夫メインバンク投資自動引落</span><span>${fmt(r.husbandAuto)}万円</span></div>
      <div class="hba-row"><span>妻メインバンク固定費</span><span>${fmt(r.wifeFixed)}万円</span></div>
      <div class="hba-row"><span>妻メインバンク投資自動引落</span><span>${fmt(r.wifeAuto)}万円</span></div>
      <div class="hba-row"><span>妻PayPay必要額(給付含む)</span><span>${fmt(r.wifePayPayNeed)}万円</span></div>
    </div>`;
    content.innerHTML = html;

    content.querySelectorAll('[data-check]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        setCheck(monthKey, e.target.dataset.check, e.target.checked);
      });
    });
  }

  function setCheck(monthKey, key, value){
    const m = getMonth(monthKey) || {};
    m.checks = Object.assign({}, m.checks, { [key]: value });
    monthsCache[monthKey] = m;
    monthsCol.doc(monthKey).set({ checks: m.checks }, { merge: true }).catch(e=>{
      console.error('check save failed', e);
    });
  }

  function renderCatList(){
    const el = document.getElementById('cat-list');
    const trashIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>`;
    el.innerHTML = settings.categories.map((c, i) => {
      const isBenefit = c.type === "給付";
      const accountLabel = isBenefit ? "振込先" : "引落";
      return `
      <div class="hba-card" style="padding:12px;">
        <div style="display:flex; gap:6px; margin-bottom:8px; align-items:center;">
          <input type="text" data-i="${i}" data-f="name" value="${c.name}" style="flex:1; width:auto; text-align:left;">
          ${!isBenefit ? `
          <span class="payer-chip">負担
            <select data-i="${i}" data-f="payer" style="border:none; background:transparent; padding:0; font-size:11px; color:#1E2430;">
              <option value="夫" ${c.payer==="夫"?"selected":""}>夫</option>
              <option value="妻" ${c.payer==="妻"?"selected":""}>妻</option>
              <option value="夫婦" ${(!c.payer||c.payer==="夫婦")?"selected":""}>夫婦</option>
            </select>
          </span>` : ''}
          <button class="icon-delete" data-del="${i}" aria-label="削除" title="このカテゴリを削除">${trashIcon}</button>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
          <input type="number" step="0.1" data-i="${i}" data-f="amount" value="${c.amount}" style="width:70px;">
          <span class="muted">万円</span>
          <select data-i="${i}" data-f="type">
            <option value="支出" ${c.type==="支出"?"selected":""}>支出</option>
            <option value="積立" ${c.type==="積立"?"selected":""}>積立</option>
            <option value="給付" ${c.type==="給付"?"selected":""}>給付</option>
          </select>
          <span class="payer-chip">${accountLabel}
            <select data-i="${i}" data-f="account" style="border:none; background:transparent; padding:0; font-size:11px; color:#1E2430;">
              ${ACCOUNTS.map(a=>`<option value="${a}" ${c.account===a?"selected":""}>${a}</option>`).join('')}
            </select>
          </span>
        </div>
        ${c.type==="積立" ? `
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:10px; padding-top:10px; border-top:1px dashed #E3E0D4;">
          <span class="muted">現在の残高</span>
          <input type="number" step="1" data-i="${i}" data-f="currentBalance" value="${c.currentBalance!=null?c.currentBalance:0}" style="width:70px;">
          <span class="muted">万円</span>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px;">
          <span class="muted">年利</span>
          <input type="number" step="0.1" data-i="${i}" data-f="annualReturn" value="${c.annualReturn!=null?c.annualReturn:6}" style="width:60px;">
          <span class="muted">%</span>
          <span class="muted" style="margin-left:10px;">最終目標</span>
          <input type="number" step="1" data-i="${i}" data-f="goalTarget" value="${c.goalTarget!=null?c.goalTarget:''}" placeholder="任意" style="width:70px;">
          <span class="muted">万円</span>
        </div>` : ''}
      </div>
    `;}).join('');
    el.querySelectorAll('input,select').forEach(inp => {
      inp.addEventListener('change', (e) => {
        const i = Number(e.target.dataset.i), f = e.target.dataset.f;
        if(f==="amount" || f==="annualReturn" || f==="currentBalance"){
          settings.categories[i][f] = parseFloat(e.target.value)||0;
        } else if(f==="goalTarget"){
          settings.categories[i][f] = e.target.value==='' ? null : (parseFloat(e.target.value)||0);
        } else {
          settings.categories[i][f] = e.target.value;
        }
        if(f==="type") renderCatList();
      });
    });
    el.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const i = Number(e.currentTarget.dataset.del);
        if(confirm(`「${settings.categories[i].name}」を削除しますか？`)){
          settings.categories.splice(i, 1);
          renderCatList();
        }
      });
    });
  }

  function renderHistory(){
    const months = listMonths();
    const el = document.getElementById('history-list');
    if(months.length===0){ el.innerHTML = '<p class="muted">まだ記録がありません。</p>'; return; }
    let html = '';
    for(const mk of months.slice().reverse()){
      const m = getMonth(mk);
      const r = computeInstructions(m);
      const items = getInstructionItems(r);
      const checks = m.checks || {};
      const doneCount = items.filter(it => checks[it.key]).length;
      const statusColor = doneCount===items.length ? '#2F6F5E' : '#D8B24A';
      html += `<div class="hba-card">
        <div style="display:flex; justify-content:space-between; align-items:center;"><span class="big" style="font-size:16px;">${mk}</span>
        <button class="secondary" data-view="${mk}">振込指示を見る</button></div>
        <div class="muted" style="margin-top:6px;">夫手取り${fmt(m.husbandIncome)}万円／妻手取り${fmt(m.wifeIncome)}万円</div>
        <div style="margin-top:6px; font-size:12px; font-weight:700; color:${statusColor};">✅ ${doneCount}/${items.length} 完了</div>
      </div>`;
    }
    el.innerHTML = html;
    el.querySelectorAll('[data-view]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        switchTab('instr');
        renderInstructions(e.target.dataset.view);
      });
    });
  }

  function switchTab(name){
    document.querySelectorAll('.hba-tab').forEach(t=>t.classList.toggle('active', t.dataset.page===name));
    document.querySelectorAll('.hba-page').forEach(p=>p.classList.toggle('active', p.id==='page-'+name));
  }

  function futureValue(monthly, annualRatePct, months, principal){
    const r = (annualRatePct/100)/12;
    const p = principal || 0;
    if(r === 0) return p + monthly*months;
    return p*(1+r)**months + monthly*(((1+r)**months - 1)/r);
  }
  function monthsToTarget(monthly, annualRatePct, target, principal){
    const p = principal || 0;
    if(p >= target) return 0;
    if(monthly<=0) return null;
    const r = (annualRatePct/100)/12;
    if(r === 0) return (target-p)/monthly;
    let months = 0, balance = p;
    const maxMonths = 1200;
    while(balance < target && months < maxMonths){ balance = balance*(1+r) + monthly; months++; }
    return months >= maxMonths ? null : months;
  }

  let simChartInstance = null;
  function renderSim(){
    const el = document.getElementById('sim-list');
    const goalCats = settings.categories.filter(c=>c.type==="積立");
    if(goalCats.length===0){ el.innerHTML = '<p class="muted">積立系のカテゴリがありません。「設定」タブで種別を積立にしてください。</p>'; return; }
    const horizons = [5,10,20,30];
    let html = '';
    let totalByHorizon = [0,0,0,0];
    goalCats.forEach((c) => {
      const rate = c.annualReturn!=null ? c.annualReturn : 6;
      const principal = c.currentBalance || 0;
      const fvs = horizons.map(y => futureValue(c.amount, rate, y*12, principal));
      fvs.forEach((v,i)=> totalByHorizon[i]+=v);
      let goalLine = '';
      if(c.goalTarget){
        const m = monthsToTarget(c.amount, rate, c.goalTarget, principal);
        goalLine = m!=null
          ? `<div class="muted" style="margin-top:8px;">目標${c.goalTarget}万円まで約${(m/12).toFixed(1)}年</div>`
          : `<div class="muted" style="margin-top:8px;">現在の月額では目標に到達しません</div>`;
      }
      html += `<div class="hba-card">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <span style="font-weight:700;">${c.name}</span>
          <span class="pill">現在${principal}万＋月${c.amount}万・年利${rate}%</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:13px;">
          ${horizons.map((y,i)=>`<div style="text-align:center;"><div class="muted">${y}年後</div><div style="font-weight:700;">${fmt(fvs[i])}万円</div></div>`).join('')}
        </div>
        ${goalLine}
      </div>`;
    });
    html += `<div class="hba-action-card">
      <div style="font-weight:700; margin-bottom:10px;">積立合計(全カテゴリ)</div>
      <div style="display:flex; justify-content:space-between; font-size:13px;">
        ${horizons.map((y,i)=>`<div style="text-align:center;"><div class="muted">${y}年後</div><div style="font-weight:700;">${fmt(totalByHorizon[i])}万円</div></div>`).join('')}
      </div>
    </div>`;
    el.innerHTML = html;

    const ctx = document.getElementById('sim-chart');
    if(simChartInstance) simChartInstance.destroy();
    if(ctx && window.Chart){
      simChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: horizons.map(y=>y+'年後'),
          datasets: [{
            label: '積立合計(万円)',
            data: totalByHorizon,
            backgroundColor: 'rgba(124,179,66,0.75)',
            borderRadius: 10,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 1100, easing: 'easeOutQuart' },
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { color: '#9BAE83', font: { family: "'M PLUS Rounded 1c'" } }, grid: { color: '#EFF7DE' } },
            x: { ticks: { color: '#6E8B3D', font: { family: "'M PLUS Rounded 1c'", weight: 700 } }, grid: { display: false } }
          }
        }
      });
    }
  }

  document.querySelectorAll('.hba-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      switchTab(tab.dataset.page);
      if(tab.dataset.page==='instr'){
        const mk = document.getElementById('in-month').value || thisMonthStr();
        renderInstructions(mk);
      }
      if(tab.dataset.page==='history') renderHistory();
      if(tab.dataset.page==='sim') renderSim();
      if(tab.dataset.page==='settings'){
        renderCatList();
        renderHomePhoto();
      }
    });
  });

  document.getElementById('add-cat-btn').addEventListener('click', ()=>{
    settings.categories.push({id:'custom_'+Date.now(), name:'新しいカテゴリ', amount:0, type:'支出', account:ACCOUNTS[0], payer:'夫婦'});
    renderCatList();
  });
  document.getElementById('save-settings-btn').addEventListener('click', ()=>{
    saveSettings();
  });

  document.getElementById('save-month-btn').addEventListener('click', ()=>{
    const monthKey = document.getElementById('in-month').value;
    if(!monthKey){ alert('年月を選択してください'); return; }
    const data = {
      husbandIncome: parseFloat(document.getElementById('in-h-income').value)||0,
      wifeIncome: parseFloat(document.getElementById('in-w-income').value)||0,
      husbandBalance: parseFloat(document.getElementById('in-h-balance').value)||0,
      wifeBalance: parseFloat(document.getElementById('in-w-balance').value)||0,
    };
    setMonth(monthKey, data).then(()=>{
      const s = document.getElementById('save-status');
      s.textContent = monthKey+' を保存しました(相手にも自動反映されます)';
      setTimeout(()=> s.textContent='', 3000);
      switchTab('instr');
      renderInstructions(monthKey);
    }).catch(e=>{
      document.getElementById('save-status').textContent = '保存に失敗しました: '+e.message;
    });
  });

  // ---- 起動フロー: 匿名認証 → Firestoreのリアルタイム購読 ----
  function tryStartApp(){
    if(!settingsLoaded || !monthsLoaded || appStarted) return;
    appStarted = true;
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app-root').style.display = 'block';
    setConn('リアルタイム同期中', '#2F6F5E');
    renderHomePhoto();
    renderHomeMessage();

    const mk = thisMonthStr();
    document.getElementById('in-month').value = mk;
    const existing = getMonth(mk);
    if(existing){
      document.getElementById('in-h-income').value = existing.husbandIncome;
      document.getElementById('in-w-income').value = existing.wifeIncome;
      document.getElementById('in-h-balance').value = existing.husbandBalance;
      document.getElementById('in-w-balance').value = existing.wifeBalance;
    }
    renderInstructions(existing ? mk : null);
  }

  function onRemoteUpdate(){
    if(!appStarted) return;
    renderHomePhoto();
    const active = document.querySelector('.hba-tab.active').dataset.page;
    if(active==='instr') renderInstructions(currentMonthKey || document.getElementById('in-month').value);
    if(active==='history') renderHistory();
    if(active==='sim') renderSim();
    if(active==='settings'){
      renderCatList();
    }
  }

  auth.onAuthStateChanged(user => {
    if(!user){ auth.signInAnonymously().catch(e=>setConn('接続エラー: '+e.message, '#C0503A')); return; }

    settingsRef.onSnapshot(doc => {
      if(doc.exists){
        settings = doc.data();
      } else {
        settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
        settingsRef.set(settings); // 初回だけ初期値を書き込む
      }
      if(settings.categories) settings.categories.forEach(c=>{
        if(c.type==="積立" && c.currentBalance==null) c.currentBalance = 0;
        if(!c.payer) c.payer = '夫婦';
      });
      settingsLoaded = true;
      tryStartApp();
      onRemoteUpdate();
    }, e => setConn('接続エラー: '+e.message, '#C0503A'));

    monthsCol.onSnapshot(snap => {
      monthsCache = {};
      snap.forEach(d => { monthsCache[d.id] = d.data(); });
      monthsLoaded = true;
      tryStartApp();
      onRemoteUpdate();
    }, e => setConn('接続エラー: '+e.message, '#C0503A'));
  });
})();
</script>
